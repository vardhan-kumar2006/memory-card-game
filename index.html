<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlipMatch 🧠 Emoji Memory Card Game</title>
  <meta name="description" content="A fun, fast, and addictive Emoji Memory Matching Game built with pure HTML5, CSS3, and JavaScript.">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Game Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Background decorative glow circles -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <main class="game-wrapper">
    <!-- Header -->
    <header class="game-header">
      <div class="title-badge">
        <i class="fa-solid fa-brain"></i> Brain Booster
      </div>
      <h1>FlipMatch</h1>
      <p class="subtitle">Flip, match pairs, and test your photographic memory!</p>
    </header>

    <!-- Top Stats Bar -->
    <section class="stats-panel">
      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-stopwatch"></i></div>
        <div class="stat-info">
          <span class="stat-label">TIME</span>
          <span class="stat-value" id="timer">00:00</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-arrows-rotate"></i></div>
        <div class="stat-info">
          <span class="stat-label">MOVES</span>
          <span class="stat-value" id="moves-count">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-star"></i></div>
        <div class="stat-info">
          <span class="stat-label">RATING</span>
          <span class="stat-value stars" id="stars-rating">⭐⭐⭐</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon"><i class="fa-solid fa-trophy"></i></div>
        <div class="stat-info">
          <span class="stat-label">BEST</span>
          <span class="stat-value" id="best-score">--</span>
        </div>
      </div>
    </section>

    <!-- Action Toolbar (Difficulty & Controls) -->
    <section class="toolbar">
      <div class="difficulty-picker">
        <button class="diff-btn active" data-pairs="6">Easy (12 Cards)</button>
        <button class="diff-btn" data-pairs="8">Normal (16 Cards)</button>
      </div>

      <div class="tool-controls">
        <button class="icon-btn" id="sound-toggle-btn" title="Toggle Sound">
          <i class="fa-solid fa-volume-high"></i>
        </button>
        <button class="btn btn-restart" id="restart-btn">
          <i class="fa-solid fa-rotate-right"></i> Restart
        </button>
      </div>
    </section>

    <!-- Interactive Card Grid -->
    <section class="board-container">
      <div class="memory-grid" id="grid">
        <!-- Cards will be dynamically generated by script.js -->
      </div>
    </section>
  </main>

  <!-- Win Celebration Modal -->
  <div class="modal-backdrop" id="win-modal">
    <div class="modal-card">
      <div class="win-trophy">🏆</div>
      <h2>Fantastic Job!</h2>
      <p class="win-subtitle">You matched all the pairs!</p>

      <div class="win-stats-grid">
        <div class="win-stat-box">
          <span class="win-label">Time Taken</span>
          <span class="win-value" id="modal-time">00:34</span>
        </div>
        <div class="win-stat-box">
          <span class="win-label">Total Moves</span>
          <span class="win-value" id="modal-moves">14</span>
        </div>
        <div class="win-stat-box">
          <span class="win-label">Final Rating</span>
          <span class="win-value" id="modal-stars">⭐⭐⭐</span>
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-primary" id="modal-play-again-btn">
          <i class="fa-solid fa-play"></i> Play Again
        </button>
      </div>
    </div>
  </div>

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <script src="script.js"></script>
</body>
</html>
